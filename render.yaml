services:
  - type: web
    name: seva-cyber-sandbox-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api_server:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /api/system/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SEVA_OPERATOR_AUTH_ENABLED
        value: "true"
      - key: SEVA_THREAT_INTEL_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: seva-evidence-private
